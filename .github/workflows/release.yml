name: Release Obsidian plugin

on:
  push:
    tags:
      - "*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install dependencies
        run: npm ci

      - name: Verify plugin
        run: npm run verify

      - name: Verify version matches tag
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          MANIFEST_VERSION=$(node -p "require('./manifest.json').version")
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          LOCK_VERSION=$(node -p "require('./package-lock.json').version")
          if [ "$TAG" != "$MANIFEST_VERSION" ] || [ "$TAG" != "$PACKAGE_VERSION" ] || [ "$TAG" != "$LOCK_VERSION" ]; then
            echo "Tag ($TAG), manifest ($MANIFEST_VERSION), package ($PACKAGE_VERSION), and lockfile ($LOCK_VERSION) must match"
            exit 1
          fi

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            styles.css
            transparent-proto.cjs
            transparent-proto.html

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          gh release create "$TAG" \
            --title "$TAG" \
            --draft \
            --generate-notes \
            main.js manifest.json styles.css transparent-proto.cjs transparent-proto.html
